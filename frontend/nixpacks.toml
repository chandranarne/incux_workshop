# Nixpacks build plan for the IncuxAI frontend.
# Vite 8 / rolldown needs Node 22+ (node:util styleText). Nixpacks defaults to
# Node 18, so pin 22 explicitly here AND in .nvmrc / package.json engines.
[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server.js"
